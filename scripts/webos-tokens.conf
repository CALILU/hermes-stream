# Tokens de Developer Mode para renovación remota via API REST
# Formato: nombre|token
#
# CÓMO EXTRAER EL TOKEN:
#   ssh -p 9922 prisoner@<IP_TV> "cat /var/luna/preferences/devmode_enabled"
#
# IMPORTANTE: Cada TV necesita una cuenta LG DIFERENTE para Developer Mode.
# Si dos TVs usan la misma cuenta, solo la última logueada tiene sesión válida.
#
# Ejemplo:
# miLGTV|abc123def456...
# nuevaTV|xyz789ghi012...
# familiar-maria|token-aqui...
#
# --- TVs propias (completar cuando estés en casa) ---
#miLGTV|PENDIENTE-EXTRAER-TOKEN
#nuevaTV|PENDIENTE-EXTRAER-TOKEN
#
# --- TVs de familiares (añadir tras instalar) ---
