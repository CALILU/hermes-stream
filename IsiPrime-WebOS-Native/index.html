<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; media-src * data: blob:; img-src * data: blob:; connect-src * data: blob:;">
    <title>IsiPrime</title>
    <link id="app-css" rel="stylesheet" href="css/styles.css">
    <script>
    (function() {
        var url = (localStorage.getItem('isiprime_server_url') || 'http://192.168.1.45:8080');
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = url + '/tv-app/css/styles.css?v=' + Date.now();
        link.onload = function() { document.getElementById('app-css').disabled = true; };
        document.head.appendChild(link);
    })();
    </script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <img class="loading-logo" src="assets/icon-hd.png" alt="IsiPrime">
        <div class="loading-spinner"></div>
        <div class="loading-text">Cargando...</div>
    </div>

    <!-- Login View -->
    <div id="login-view" class="view login-view" style="display:none">
        <div class="login-card">
            <div class="login-logo-container">
                <img src="icon.png" alt="IsiPrime" class="login-logo">
            </div>
            <h1 class="login-title">IsiPrime</h1>
            <p class="login-subtitle">Introduce tus credenciales para acceder</p>
            <div class="login-field">
                <label class="login-label" for="login-username">Usuario</label>
                <input type="text" id="login-username" class="login-input focusable" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>
            <div class="login-field">
                <label class="login-label" for="login-password">Contraseña</label>
                <input type="password" id="login-password" class="login-input focusable" autocomplete="off">
            </div>
            <button id="login-btn" class="login-btn focusable">Iniciar sesión</button>
            <div id="login-error" class="login-error"></div>
        </div>
    </div>

    <!-- App Container -->
    <div id="app-container" style="display:none">
        <nav id="nav-bar" class="nav-bar">
            <div class="nav-logo">
                <img class="nav-logo-icon" src="icon.png" alt="">
                <img class="nav-logo-img" src="assets/logo.svg" alt="IsiPrime">
                <span id="nav-version" class="nav-version"></span>
            </div>
            <div class="nav-items">
                <div class="nav-item focusable active" data-view="home">Películas</div>
                <div class="nav-item focusable" data-view="series">Series</div>
                <div class="nav-item focusable" data-view="genres">Géneros</div>
                <div class="nav-item focusable" data-view="years">Años</div>
                <div class="nav-item focusable" data-view="sagas">Sagas</div>
                <div class="nav-item focusable" data-view="favorites">Favoritos</div>
                <div class="nav-item focusable" data-view="search">Buscar</div>
                <div class="nav-item focusable" data-view="requests">Peticiones</div>
            </div>
        </nav>
        <div id="home-view" class="view home-view"></div>
        <div id="genre-view" class="view genre-view" style="display:none"></div>
        <div id="years-view" class="view genre-view" style="display:none"></div>
        <div id="sagas-view" class="view genre-view" style="display:none"></div>
        <div id="detail-overlay" class="view detail-overlay" style="display:none"></div>
        <div id="player-view" class="view player-view" style="display:none"></div>
        <div id="series-view" class="view series-view" style="display:none"></div>
        <div id="search-view" class="view search-view" style="display:none"></div>
        <div id="actor-view" class="view actor-view" style="display:none"></div>
        <div id="requests-view" class="view requests-view" style="display:none"></div>
    </div>

    <!-- webOS TV platform library (pre-installed on TV) -->
    <script src="webOSTVjs-1.2.10/webOSTV.js" onerror=""></script>
    <script src="webOSTVjs-1.2.10/webOSTV-dev.js" onerror=""></script>

    <!-- Prevent webOS default key handling (BACK closes app, arrows scroll page) -->
    <script>
    (function() {
        var managedKeys = {
            37:1, 38:1, 39:1, 40:1,   // LEFT, UP, RIGHT, DOWN
            13:1, 461:1, 10182:1,      // OK, BACK, EXIT
            403:1, 404:1, 405:1, 406:1, // RED, GREEN, YELLOW, BLUE
            415:1, 19:1, 413:1, 417:1, 412:1 // PLAY, PAUSE, STOP, FF, RW
        };
        document.addEventListener('keydown', function(e) {
            if (managedKeys[e.keyCode]) {
                e.preventDefault();
            }
        }, true);
    })();
    </script>

    <!-- Config always local (contains SERVER_URL) -->
    <script src="js/config.js"></script>

    <!-- Dynamic loader: loads JS from server, falls back to local -->
    <script>
    (function() {
        var modules = [
            'api', 'login', 'images', 'focus',
            'nav-bar', 'sidebar-grid-view', 'keyboard',
            'carousel', 'router',
            'home', 'genre', 'years', 'sagas', 'detail', 'player',
            'series', 'search', 'requests', 'actor', 'app'
        ];
        var base = App.Config.SERVER_URL + '/tv-app/js/';
        var v = Date.now();
        var i = 0;

        function next() {
            if (i >= modules.length) return;
            var name = modules[i];
            var s = document.createElement('script');
            s.src = base + name + '.js?v=' + v;
            s.onload = function() { i++; next(); };
            s.onerror = function() {
                var local = document.createElement('script');
                local.src = 'js/' + name + '.js';
                local.onload = function() { i++; next(); };
                local.onerror = function() { console.error('Failed to load: ' + name); i++; next(); };
                document.body.appendChild(local);
            };
            document.body.appendChild(s);
        }
        next();
    })();
    </script>
</body>
</html>
