<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsiPrime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .logo {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: -2px;
            color: #c4b5fd;
            margin-bottom: 24px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(196, 181, 253, 0.2);
            border-top-color: #c4b5fd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        .status {
            font-size: 20px;
            color: rgba(255,255,255,0.6);
        }
        .error {
            display: none;
            text-align: center;
            max-width: 600px;
        }
        .error h2 {
            color: #ef4444;
            font-size: 28px;
            margin-bottom: 12px;
        }
        .error p {
            font-size: 18px;
            color: rgba(255,255,255,0.5);
            line-height: 1.5;
        }
        .retry-btn {
            margin-top: 24px;
            padding: 12px 32px;
            background: #818cf8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        .retry-btn:focus {
            outline: 3px solid #c4b5fd;
            outline-offset: 2px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="logo">IsiPrime</div>
        <div class="spinner"></div>
        <p class="status">Conectando al servidor...</p>
    </div>
    <div id="error" class="error">
        <h2>Sin conexion</h2>
        <p>No se pudo conectar con el servidor IsiPrime.<br>Verifica que el servidor este encendido.</p>
        <button class="retry-btn" onclick="connectToServer()">Reintentar</button>
    </div>
    <script>
        // Server URL - change this to your IsiPrime server IP
        var SERVER_URL = 'http://192.168.1.18:8080';

        function connectToServer() {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('error').style.display = 'none';

            // Test connection before redirect
            var img = new Image();
            img.onload = function() {
                window.location.href = SERVER_URL;
            };
            img.onerror = function() {
                // Try direct redirect anyway (favicon might not exist)
                var xhr = new XMLHttpRequest();
                xhr.timeout = 5000;
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status >= 200 && xhr.status < 400) {
                            window.location.href = SERVER_URL;
                        } else {
                            showError();
                        }
                    }
                };
                xhr.ontimeout = function() { showError(); };
                xhr.onerror = function() {
                    // Last resort: redirect anyway
                    window.location.href = SERVER_URL;
                };
                try {
                    xhr.open('GET', SERVER_URL + '/api/auth/status', true);
                    xhr.send();
                } catch(e) {
                    window.location.href = SERVER_URL;
                }
            };
            img.src = SERVER_URL + '/favicon.ico?' + Date.now();
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            // Focus retry button for TV remote navigation
            setTimeout(function() {
                document.querySelector('.retry-btn').focus();
            }, 100);
        }

        // Auto-connect on load
        connectToServer();
    </script>
</body>
</html>
