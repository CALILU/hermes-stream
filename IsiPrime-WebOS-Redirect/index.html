<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
    <title>IsiPrime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }
        .logo {
            width: 400px;
            height: 400px;
            border-radius: 60px;
            margin-bottom: 40px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(196, 181, 253, 0.2);
            border-top-color: #c4b5fd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        .status {
            font-size: 24px;
            color: rgba(255,255,255,0.6);
        }
        .error {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 700px;
        }
        .error h2 {
            color: #ef4444;
            font-size: 36px;
            margin-bottom: 16px;
        }
        .error p {
            font-size: 22px;
            color: rgba(255,255,255,0.5);
            line-height: 1.5;
        }
        .retry-btn {
            margin-top: 32px;
            padding: 16px 48px;
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .retry-btn:focus, .retry-btn:hover {
            background: #6d28d9;
            box-shadow: 0 0 0 3px #c4b5fd;
            outline: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading" style="display:flex;flex-direction:column;align-items:center">
        <img class="logo" src="icon-hd.png" alt="IsiPrime">
        <div class="spinner"></div>
        <p class="status">Conectando al servidor...</p>
    </div>
    <div id="error" class="error">
        <img class="logo" src="icon-hd.png" alt="IsiPrime">
        <h2>Sin conexion</h2>
        <p>No se pudo conectar con el servidor IsiPrime.<br>Verifica que el servidor este encendido.</p>
        <button class="retry-btn" onclick="connectToServer()">Reintentar</button>
    </div>
    <script>
        // =============================================
        // CONFIGURAR AQUI la URL del servidor IsiPrime
        // =============================================
        var SERVER_URL = 'https://calilu.mooo.com';
        // Fallback LAN (si HTTPS no responde)
        var SERVER_URL_LAN = 'http://192.168.1.18:8080';

        function connectToServer() {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('error').style.display = 'none';

            // Try HTTPS first, then LAN fallback
            tryConnect(SERVER_URL, function(ok) {
                if (ok) {
                    window.location.href = SERVER_URL;
                } else {
                    tryConnect(SERVER_URL_LAN, function(ok2) {
                        if (ok2) {
                            window.location.href = SERVER_URL_LAN;
                        } else {
                            showError();
                        }
                    });
                }
            });
        }

        function tryConnect(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.timeout = 5000;
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    callback(xhr.status >= 200 && xhr.status < 400);
                }
            };
            xhr.ontimeout = function() { callback(false); };
            xhr.onerror = function() { callback(false); };
            try {
                xhr.open('GET', url + '/api/auth/status', true);
                xhr.send();
            } catch(e) {
                callback(false);
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'flex';
            setTimeout(function() {
                document.querySelector('.retry-btn').focus();
            }, 100);
        }

        // Auto-connect on load
        connectToServer();
    </script>
</body>
</html>
